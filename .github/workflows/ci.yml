name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Worker(TypeScript)の型チェック
      - run: npx tsc --noEmit
      # ブラウザJSの構文チェック（過去に構文エラーで本番が壊れたため）
      - run: node --check public/app.js
      # 生成スクリプトの構文チェック。実行はしない（OGP生成は macOS のフォントに依存し
      # Linux では日本語が豆腐化するため、CIで再生成しても正しい出力にならない）
      - run: node --check scripts/make-og.mjs
      # 静的アセットの参照先が実在するか
      - name: check static assets exist
        run: |
          test -f public/index.html
          test -f public/styles.css
          test -f public/app.js
          test -f public/og.png
