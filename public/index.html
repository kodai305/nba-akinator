<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#fff9f0" />
<title>Ballerdle — 毎日ひとり、NBA選手を当てる</title>
<meta name="description" content="Yes/No質問を重ねて、今日のNBA選手を当てよう。1日1問。" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://ballerdle.tkg216.org/" />
<meta property="og:title" content="Ballerdle — 毎日ひとり、NBA選手を当てる" />
<meta property="og:description" content="Yes/No質問を重ねて、今日のNBA選手を当てよう。1日1問。" />
<meta property="og:image" content="https://ballerdle.tkg216.org/og.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Ballerdle — 毎日ひとり、NBA選手を当てる" />
<meta name="twitter:description" content="Yes/No質問を重ねて、今日のNBA選手を当てよう。1日1問。" />
<meta name="twitter:image" content="https://ballerdle.tkg216.org/og.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="app">
  <header>
    <div class="ball" aria-hidden="true">🏀</div>
    <h1><span class="accent">Ballerdle</span></h1>
    <p class="sub">毎日ひとり、NBA選手を当てる。</p>
    <div class="daybadge-row"><span class="qbadge" id="daybadge">#--</span></div>
    <div class="progress" id="progress"></div>
  </header>

  <div class="log" id="log"></div>

  <footer>
    <div class="segment">
      <button id="tabAsk" class="seg-btn active" type="button">質問する</button>
      <button id="tabGuess" class="seg-btn" type="button">当てる</button>
    </div>
    <div class="inputrow">
      <input id="text" type="text" autocomplete="off" placeholder="例: その選手はガードですか？" />
      <button id="send" class="btn btn-orange" type="button">送信</button>
    </div>
    <div class="hint"><span id="hintText">はい / いいえ / どちらとも、で答えるよ。</span> <a href="#" id="giveup">降参する</a></div>
  </footer>
</div>

<div class="overlay" id="overlay">
  <canvas id="confetti"></canvas>
  <div class="card">
    <!-- 結果カードの文言は app.js が実行時に入れる。
         静的HTMLに書くと、CSSを実行しないクローラ（LINE等）が本文テキストを
         拾ってリンクプレビューの説明文にしてしまうため。 -->
    <div class="card-emoji" id="cardEmoji"></div>
    <h2 id="resultTitle"></h2>
    <div class="name" id="resultName"></div>
    <div class="stamp" id="stamp" style="display:none"></div>
    <div class="trace-row" id="traceRow"></div>
    <p id="resultDesc"></p>
    <div class="share-row">
      <button id="shareX" class="btn btn-blue" type="button"></button>
      <button id="shareCopy" class="btn btn-orange" type="button"></button>
    </div>
    <p class="countdown" id="countdown"></p>
  </div>
</div>

<script src="/app.js" defer></script>
</body>
</html>
