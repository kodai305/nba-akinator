name = "nba-akinator"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true  # 旧URL(nba-akinator.*.workers.dev)も有効のまま残す

# 独自ドメイン（Cloudflareゾーン tkg216.org のサブドメイン）。
# deploy 時に DNS レコードと証明書が自動発行される。
routes = [
  { pattern = "ballerdle.tkg216.org", custom_domain = true }
]

# Workers AI binding: env.AI.run("typesafe/jev", ...)
[ai]
binding = "AI"

[vars]
# "jev" にすると typesafe.ai の Jev(Noul) を直接呼ぶ（要 TYPESAFE_API_KEY）。
# 未設定/キー無しなら Cloudflare 無料モデルにフォールバック。
BACKEND = "jev"
# TYPESAFE_API_KEY は秘密情報:
#   ローカル → .dev.vars (gitignore済み)
#   本番     → wrangler secret put TYPESAFE_API_KEY
